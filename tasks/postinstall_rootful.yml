# Based on: https://docs.docker.com/engine/install/linux-postinstall/
---
- name: Post-install | Create docker group
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Post-install | Store non-root user name
  ansible.builtin.set_fact:
    docker_non_root_user: "{{ ansible_facts.user_id }}"

- name: Post-install | Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_non_root_user }}"
    groups: docker
    append: true
    state: present
  become: true
  notify: Reset ssh connection

- name: Post-install | Start and enable docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
