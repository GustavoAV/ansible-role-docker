---
- name: Include OS specific tasks
  ansible.builtin.include_tasks:
    file: "{{ ansible_facts.os_family | lower }}.yml"

- name: Install Docker and Docker Compose
  ansible.builtin.package:
    name: "{{ docker_install_pkgs }}"
    state: present
  become: true

- name: Post-install tasks - Rootful mode
  ansible.builtin.include_tasks:
    file: postinstall_rootful.yml
  when: docker_enable_rootless_mode is not truthy

- name: Post-install tasks - Rootless mode
  ansible.builtin.include_tasks:
    file: postinstall_rootless.yml
  when: docker_enable_rootless_mode is truthy

- name: Configure docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_json_content }}"
    dest: "{{ docker_daemon_json_path }}"
    mode: "0644"
    backup: true
    validate: "{{ dockerd_bin_path }} --config-file=%s --validate"
  diff: true
  become: "{{ not docker_enable_rootless_mode }}"
  notify: Restart docker daemon

- name: Apply notified handlers
  ansible.builtin.meta: flush_handlers

- name: Check if daemon is rootless
  ansible.builtin.command:
    argv:
      - "{{ docker_bin_path }}"
      - info
      - --format
      - >-
        {% raw %}{{ range .SecurityOptions }}{{ if eq . "name=rootless" }}true{{ end }}{{ end }}{% endraw %}
  changed_when: false
  register: docker_daemon_check_rootless
  failed_when: docker_daemon_check_rootless.stdout != 'true'
  when: docker_enable_rootless_mode is truthy

- name: Validate install
  ansible.builtin.command:
    cmd: "{{ docker_bin_path }} run --rm hello-world"
  changed_when: false
  # Do not run in GitHub Actions (docker-in-docker doesn't work atm)
  when: '"-azure" not in ansible_facts.kernel'
