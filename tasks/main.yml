---
- name: Include OS specific tasks
  ansible.builtin.include_tasks:
    file: "{{ ansible_os_family | lower }}.yml"

- name: Install Docker and Docker Compose
  ansible.builtin.package:
    name: "{{ docker_install_pkgs }}"
    state: present
  become: true

- name: Create docker group
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Store non-root user name
  ansible.builtin.set_fact:
    docker_non_root_user: "{{ ansible_facts.user_id }}"

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ docker_non_root_user }}"
    groups: docker
    append: true
    state: present
  become: true
  notify: Reset ssh connection

- name: Configure docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_json }}"
    dest: /etc/docker/daemon.json
    mode: "0644"
    backup: true
    validate: dockerd --config-file=%s --validate
  diff: true
  become: true
  notify: Restart docker daemon

- name: Start and enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Apply notified handlers
  ansible.builtin.meta: flush_handlers

- name: Validate install
  ansible.builtin.command:
    cmd: docker run --rm hello-world
  changed_when: false
  # Do not run in GitHub Actions (docker-in-docker doesn't work atm)
  when: >
    "-azure" not in ansible_facts['kernel']
