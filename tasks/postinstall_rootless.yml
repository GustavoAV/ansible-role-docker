# Based on:
# - https://docs.docker.com/engine/security/rootless/
# - https://docs.docker.com/engine/security/rootless/troubleshoot/
---
- name: Post-install - Kernel | Add kernel module
  community.general.modprobe:
    name: nf_tables
    state: present
    persistent: present
  become: true

- name: Post-install - Kernel | Configure kernel
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/90-docker.conf
  become: true
  loop:
    - name: kernel.unprivileged_userns_clone
      value: 1
    - name: net.ipv4.ip_forward
      value: 1
  # In my usage, errors stopped only after reboot
  # https://docs.docker.com/engine/security/rootless/troubleshoot/#errors-when-starting-the-docker-daemon
  notify: Reboot host

- name: Post-install - System service | Stop and disable system docker
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    scope: system
    # masked: true
  become: true
  loop: [docker.service, docker.socket]

- name: Post-install - System service | Remove system docker socket
  ansible.builtin.file:
    path: /var/run/docker.sock
    state: absent
  become: true

- name: Post-install - Resources | Create directory
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d
    mode: "0755"
    state: directory
    owner: root
    group: root
  become: true

# To enable resources delegation
# https://docs.docker.com/engine/security/rootless/tips/#limiting-resources
- name: Post-install - Resources | Create resources delegate config file
  ansible.builtin.copy:
    content: |
      [Service]
      Delegate=cpu cpuset io memory pids
    dest: /etc/systemd/system/user@.service.d/delegate.conf
    mode: "0644"
    owner: root
    group: root
    backup: true
  become: true
  notify: Systemd daemon reload

- name: Post-install - Install | Configure rootless docker
  ansible.builtin.command:
    cmd: dockerd-rootless-setuptool.sh install
    creates: ~/.config/systemd/user/docker.service

- name: Post-install - Install | Configure bashrc
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    line: "{{ item }}"
    state: present
  loop:
    - PATH="$HOME/bin:$PATH"
    - export DOCKER_HOST=unix:///run/user/{{ ansible_facts.user_uid }}/docker.sock

- name: Post-install - User service | Start and enable user docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    scope: user

- name: Post-install - User service | Store non-root user name
  ansible.builtin.set_fact:
    docker_non_root_user: "{{ ansible_facts.user_id }}"

- name: Post-install - User service | Enable docker start even when user is not logged
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ docker_non_root_user }}
    creates: /var/lib/systemd/linger/{{ docker_non_root_user }}
  become: true
