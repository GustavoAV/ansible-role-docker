---
all:
  hosts:
    rootful:
      ansible_host: 127.0.0.1
      ansible_port: 2211
      ansible_ssh_private_key_file: .vagrant/machines/rootful/virtualbox/private_key
      docker_enable_rootless_mode: false
    rootless:
      ansible_host: 127.0.0.1
      ansible_port: 2212
      ansible_ssh_private_key_file: .vagrant/machines/rootless/virtualbox/private_key
      docker_enable_rootless_mode: true
